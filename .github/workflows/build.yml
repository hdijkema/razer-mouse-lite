name: Build and release
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (empty = build only)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve version and release intent
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $release = ./tools/release-version.ps1 -EventName $env:GITHUB_EVENT_NAME -RefType $env:GITHUB_REF_TYPE -RefName $env:GITHUB_REF_NAME -RequestedVersion $env:REQUESTED_VERSION
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "publish=$($release.Publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Test release version handling
        shell: pwsh
        run: ./tests/test-release-version.ps1
      - name: Validate workflow and release script
        shell: bash
        run: |
          base=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --location --retry 3 "$base/actionlint_1.7.12_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 "$base/actionlint_1.7.12_checksums.txt" -o "$RUNNER_TEMP/actionlint-checksums.txt"
          expected=$(awk '$2 == "actionlint_1.7.12_linux_amd64.tar.gz" {print $1}' "$RUNNER_TEMP/actionlint-checksums.txt")
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
          bash -n tools/publish-release.sh
  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./tools/install-inno-setup.ps1
      - name: Build, test and package ZIP and installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./build.ps1 -Qt $env:QT_ROOT_DIR -CMake cmake -BuildDirectory ./build/ci -Version $env:RELEASE_VERSION -InnoCompiler ./build/tools/inno-setup/ISCC.exe -TestInstaller
      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: razer-mouse-lite-windows-x64
          path: |
            release/*-windows-x64.zip
            release/*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-output
          path: |
            build/ci/preview-*.png
            build/ci/Testing/Temporary/LastTest.log
            build/packaging-*/startup.png
            build/packaging-*/installer-build.txt
            build/installer-test-*/*.log
          if-no-files-found: ignore
  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake ninja-build g++ pkg-config file qt6-base-dev qt6-qpa-plugins qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-svg-dev libudev-dev fonts-dejavu-core dpkg-dev
      - name: Configure and build
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMOUSE_LITE_VERSION="$RELEASE_VERSION"
          cmake --build build/ci --parallel 2
      - name: Refresh translation source discovery
        run: /usr/lib/qt6/bin/lupdate src -no-obsolete -ts translations/*.ts
      - name: Test and build Debian package
        run: |
          ctest --test-dir build/ci --output-on-failure
          mkdir -p release
          cd build/ci
          cpack -G DEB -B ../../release
      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: razer-mouse-lite-linux-x86_64
          path: release/*-linux-x86_64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-output
          path: |
            build/ci/preview-*.png
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  debian13:
    name: Debian 13 amd64
    needs: version
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ca-certificates git cmake ninja-build g++ pkg-config file qt6-base-dev qt6-qpa-plugins qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-svg-dev libudev-dev fonts-dejavu-core dpkg-dev
          . /etc/os-release
          test "$ID:$VERSION_ID" = debian:13
          test "$(dpkg --print-architecture)" = amd64
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure and build in Debian 13
        run: |
          cmake -S . -B build/debian13 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMOUSE_LITE_VERSION="$RELEASE_VERSION"
          cmake --build build/debian13 --parallel 2
      - name: Check translation sources and run tests
        run: |
          /usr/lib/qt6/bin/lupdate src -no-obsolete -ts translations/*.ts
          ctest --test-dir build/debian13 --output-on-failure
      - name: Package and test installed DEB
        run: |
          mkdir -p release
          cpack --config build/debian13/CPackConfig.cmake -G DEB -B release -D "CPACK_PACKAGE_FILE_NAME=razer-mouse-lite-$RELEASE_VERSION-debian13-amd64"
          package="release/razer-mouse-lite-$RELEASE_VERSION-debian13-amd64.deb"
          test "$(dpkg-deb -f "$package" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb -f "$package" Depends
          apt-get install -y "./$package"
          QT_QPA_PLATFORM=offscreen /usr/bin/razer-mouse --self-test --language en
          QT_QPA_PLATFORM=offscreen /usr/bin/razer-mouse --smoke-test "$GITHUB_WORKSPACE/build/debian13/installed.png" --language en
      - name: Upload Debian 13 package
        uses: actions/upload-artifact@v6
        with:
          name: razer-mouse-lite-debian13-amd64
          path: release/*-debian13-amd64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload Debian 13 test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debian13-test-output
          path: |
            build/debian13/preview-*.png
            build/debian13/installed.png
            build/debian13/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  release:
    needs: [version, windows, linux, debian13]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: razer-mouse-lite-*
          merge-multiple: true
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: bash tools/publish-release.sh release
